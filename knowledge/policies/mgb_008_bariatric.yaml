      - id: MGB-008.SADIS-REV.9
        page: 3
        text: "The member has had a dietary consultation"
        predicate: {type: boolean, field: dietary_consultation_completed}

      - id: MGB-008.SADIS-REV.10
        page: 3
        text: "The member understands the surgical procedure and post procedure compliance"
        predicate: {type: attestation, field: understands_procedure}

      - id: MGB-008.SADIS-REV.11
        page: 3
        text: "The member has a follow-up planned with their health care team"
        predicate: {type: boolean, field: followup_planned}

      - id: MGB-008.SADIS-REV.12
        page: 3
        text: "The member is not pregnant and does not plan to become pregnant for at least 18 months after surgery"
        predicate: {type: attestation, field: pregnancy_attestation}

      - id: MGB-008.SADIS-REV.13
        page: 3
        text: "The procedure will be performed at bariatric surgery center"
        predicate: {type: boolean, field: bariatric_surgery_center}

      - id: MGB-008.SADIS-REV.14
        page: 4
        text: "a. RYGB; or b. Sleeve Gastrectomy."
        predicate:
          type: enum
          field: primary_procedure
          allowed: ["RYGB", "Sleeve Gastrectomy"]
        note: >-
          Clause 14 on page 3 reads "The member's primary bariatric procedure was
          one of the following:" and its list continues onto page 4. The citation
          points at the list because that is where the enumerated values are.

