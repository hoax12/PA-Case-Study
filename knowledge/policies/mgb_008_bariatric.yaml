# Mass General Brigham Health Plan - Bariatric Surgery, Policy 008.
#
# Every `text` below is copied verbatim from the source PDF and is verified against
# it by tests/test_registry.py, so a citation cannot drift from what the policy says.
# Predicates are authored by hand from that text; scripts/extract_policy_draft.py
# drafts this file for a new payer, but a human approves it before it is used.

