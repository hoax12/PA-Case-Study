  - from: commercial
    text: "Medical necessity for bariatric surgery for adults 18 years of age and older is determined through InterQual criteria, with the exception of revisional procedures single anastomosis duodenal-ileal bypass (SADI-S) and transoral outlet reduction (TORe), for which criteria can be found below."
    to: [commercial]

# Retrieval questions, keyed by predicate field.
#
# The clause `text` above is the citation shown to the reviewer and must stay
# verbatim. It is often a poor instruction to a retrieval model: a clause phrased
# as an absence ("does not have a substance use disorder") gets answered about the
# fact rather than the clause, so "no substance use documented" comes back as "no"
# and reads as a failure. These questions fix the polarity and the answer shape.
# They ask what the documentation states; they never ask for a judgement.
evidence_questions:
  requesting_revisional_procedure: "Do the documents state that the requested procedure is a revisional (not primary) bariatric procedure? Answer yes or no."
  failed_primary_ewl_50: "Do the documents state that the member failed the primary surgery by being unable to achieve or to maintain at least 50% excess body weight loss? Answer yes or no."
  revision_indication_present: "Do the documents state that the member failed the primary surgery on excess body weight loss, or had a perioperative or late surgical complication? Answer yes or no."
  diet_activity_adherence_documented: "Do the documents record that the member has been adherent with diet and physical activity since the primary surgery? Answer yes or no."
  substance_use_cleared: "Do the documents state either that the member has no substance use disorder, or that the member has been in recovery for at least one year? Answer yes if either is stated, no if an active untreated substance use disorder is documented."
  psychiatric_cleared: "Do the documents state either that the member has no psychiatric disorder, or that a psychiatric disorder is well-managed and under control? Answer yes if either is stated, no if an uncontrolled psychiatric disorder is documented."
  psychosocial_evaluation_cleared: "Do the documents record a completed psychosocial or behavioral health evaluation that cleared the member for surgery? Answer yes or no."
  dietary_consultation_completed: "Do the documents record a completed dietary or nutritional consultation? Answer yes or no."
  understands_procedure: "Do the documents contain an attestation that the member understands the surgical procedure and the post-procedure compliance required? Answer yes or no."
  followup_planned: "Do the documents record a planned follow-up with the member's health care team? Answer yes or no."
  pregnancy_attestation: "Do the documents contain an attestation that the member is not pregnant and does not plan to become pregnant for at least 18 months after surgery? Answer yes or no."
  bariatric_surgery_center: "Do the documents name the facility performing the procedure as a bariatric surgery center? Answer yes or no."
  unable_to_achieve_weight_loss: "Do the documents state that the member has been unable to achieve or maintain weight loss? Answer yes or no."
  gi_symptoms_cleared: "Do the documents state either that the member has no significant gastrointestinal symptoms, or that such symptoms were evaluated and cleared? Answer yes or no."
