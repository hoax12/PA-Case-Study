criteria_sets:

  TORe:
    logic: all
    items:
      - id: MGB-008.TORe.1
        page: 4
        text: "The member is at least 18 years of age"
        predicate: {type: threshold, field: age, op: ">=", value: 18}

      - id: MGB-008.TORe.2
        page: 4
        text: "The member is requesting a revisional bariatric procedure"
        predicate: {type: boolean, field: requesting_revisional_procedure}

      - id: MGB-008.TORe.3
        page: 4
        text: "The member failed primary surgery due to one of the following: a. The member was unable to achieve at least 50% excess body weight loss; or b. The member was unable to maintain at least 50% excess body weight loss"
        predicate: {type: boolean, field: failed_primary_ewl_50}

      - id: MGB-008.TORe.4
        page: 4
        text: "The member's BMI is one of the following: a. At least 35 kg/m2; or b. At least 32.5 kg/m2, and the member is of Asian descent"
        predicate:
          type: threshold
          field: bmi
          op: ">="
          value: 35
          unknown_band: [32.5, 35]
        note: >-
          The 32.5 branch turns on the member being of Asian descent. The system
          never infers a protected characteristic, so a BMI in [32.5, 35) is
          UNKNOWN and goes to a reviewer rather than being scored against the
          higher threshold.

      - id: MGB-008.TORe.5
        page: 4
        text: "The primary surgery was performed at least one year ago"
        predicate:
          type: temporal
          anchor: primary_surgery_date
          op: ">="
          duration: P1Y
          relative_to: order_date

      - id: MGB-008.TORe.6
        page: 4
        text: "The member has been adherent with diet and physical activity since the primary surgery, and this adherence has been documented"
        predicate: {type: boolean, field: diet_activity_adherence_documented}

      - id: MGB-008.TORe.7
        page: 5
        text: "The member does not have a substance use disorder or has been in recovery for at least one year"
        predicate: {type: boolean, field: substance_use_cleared}

      - id: MGB-008.TORe.8
        page: 5
        text: "The member does not have a psychiatric disorder or their psychiatric disorder is well-managed and under control"
        predicate: {type: boolean, field: psychiatric_cleared}

      - id: MGB-008.TORe.9
        page: 5
        text: "The member completed a psychosocial evaluation and was cleared for surgery by a behavioral health provider"
        predicate: {type: boolean, field: psychosocial_evaluation_cleared}

      - id: MGB-008.TORe.10
        page: 5
        text: "The member has never used tobacco use or has not used tobacco for at least 6 weeks prior to the surgery"
        predicate:
          type: temporal
          anchor: last_tobacco_use_date
          op: ">="
          duration: P6W
          relative_to: planned_surgery_date
          none_ok: true
        note: >-
          The lookback is anchored to the planned surgery date, not the order date.
          A member who has never used tobacco satisfies it with no date at all.

      - id: MGB-008.TORe.11
        page: 5
        text: "The member completed a dietary consultation"
        predicate: {type: boolean, field: dietary_consultation_completed}

      - id: MGB-008.TORe.12
        page: 5
        text: "The member understands the surgical procedure and post procedure compliance"
        predicate: {type: attestation, field: understands_procedure}

      - id: MGB-008.TORe.13
        page: 5
        text: "The member has a follow-up planned with their health care team"
        predicate: {type: boolean, field: followup_planned}

      - id: MGB-008.TORe.14
        page: 5
        text: "The member is not pregnant and does not plan to become pregnant for at least 18 months after the surgery"
        predicate: {type: attestation, field: pregnancy_attestation}
        note: >-
          Pregnancy status is never inferred from the chart. This requires an
          explicit attestation in the packet or it stays UNKNOWN.

      - id: MGB-008.TORe.15
        page: 5
        text: "The procedure will be performed at bariatric surgery center"
        predicate: {type: boolean, field: bariatric_surgery_center}

      - id: MGB-008.TORe.16
        page: 5
        text: "The member's primary bariatric procedure was RYGB"
        predicate: {type: enum, field: primary_procedure, allowed: ["RYGB"]}

  SADI-S-revisional:
    logic: all
