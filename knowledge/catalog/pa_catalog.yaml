# Mass General Brigham Health Plan: Prior Authorization, Notification, and
# Referral Guidelines ("the PA guide"). This is the payer's own index of which
# services require PA at all. It is NOT clinical criteria: an entry here can say
# "PA required, see Medical Policy X", but only an authored policy in
# knowledge/policies/ can evaluate criteria. The catalog gives the router
# breadth: every listed service gets an informed referral reason instead of
# "nothing found", and its unmatched-but-PA-required hits are the authoring
# backlog, sorted by request volume.
#
# pa_required values:
#   "yes"   : PA required (for at least the common case)
#   "no"    : no PA required
#   "varies": depends on plan / product / code; the note says how
#
# Pages cite the printed page numbers in PAGuide.pdf. Entries are curated from
# the source table by a human, same review stance as a policy file: a machine
# draft may propose entries, a person owns what loads.

catalog_id: MGBHP-PA-GUIDE
title: "Prior Authorization, Notification, and Referral Guidelines"
payer: "Mass General Brigham Health Plan"
source_file: PAGuide.pdf

