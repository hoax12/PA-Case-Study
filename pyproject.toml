[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prior-auth-intake-copilot"
version = "0.1.0"
description = "Prior-authorization adjudication copilot: OCR, evidence extraction, clause-level guideline criteria, and a human-in-the-loop decision"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1,<2",
  "fastapi>=0.115,<1",
  "pillow>=11,<12",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6,<7",
  "rank-bm25>=0.2,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
